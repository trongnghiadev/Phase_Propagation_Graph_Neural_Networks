# Redis Sentinel cho Redis cache (master "cache" = redis-cache:6379).
# 3 Sentinel, cần 2 đồng ý (quorum) mới coi master là chết và chuyển sang replica.
port 26379
dir /data
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor cache redis-cache 6379 2
sentinel down-after-milliseconds cache 5000
sentinel failover-timeout cache 15000
sentinel parallel-syncs cache 1
