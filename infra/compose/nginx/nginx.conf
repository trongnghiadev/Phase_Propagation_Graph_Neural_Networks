worker_processes 1;
events { worker_connections 1024; }

http {
  # Docker DNS: phân giải lại tên container khi container khởi động lại
  resolver 127.0.0.11 valid=10s ipv6=off;

  log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr '
                      'rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log upstream;

  upstream api {
    zone api 64k;
    # "resolve": phân giải lại tên khi IP container đổi (nginx >= 1.27.3).
    # Kiểm tra sức khỏe thụ động: lỗi 2 lần trong 5 giây thì tạm loại instance 5 giây.
    server api-1:8000 resolve max_fails=2 fail_timeout=5s;
    server api-2:8000 resolve max_fails=2 fail_timeout=5s;
    server api-3:8000 resolve max_fails=2 fail_timeout=5s;
    keepalive 16;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      # Instance chết hoặc trả 502/503 thì thử instance khác
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 3;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
