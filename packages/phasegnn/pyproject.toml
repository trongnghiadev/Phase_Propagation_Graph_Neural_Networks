[project]
name = "phasegnn"
version = "0.1.0"
description = "Mô hình PhaseGNN"
requires-python = ">=3.11"
dependencies = [
  "vngis",
  "torch>=2.4",
  "torch-geometric>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phasegnn"]

[tool.uv.sources]
vngis = { workspace = true }
