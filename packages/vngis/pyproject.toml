[project]
name = "vngis"
version = "0.1.0"
description = "Thư viện lõi dùng chung"
requires-python = ">=3.11"
dependencies = [
  "pymongo>=4.10",
  "redis>=5.2",
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vngis"]
