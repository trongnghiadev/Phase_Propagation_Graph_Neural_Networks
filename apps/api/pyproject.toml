[project]
name = "api"
version = "0.2.0"
description = "REST API phân tán (GĐ7): xác thực, phân quyền bitmask, cache Redis, khóa phân tán"
requires-python = ">=3.11"
dependencies = [
  "vngis",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pymongo>=4.6",
  "redis>=5.0",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "msgpack>=1.0",
  "zstandard>=0.22",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "mongomock>=4.1",
  "fakeredis>=2.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
vngis = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
