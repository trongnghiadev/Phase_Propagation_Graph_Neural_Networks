[project]
name = "api"
version = "0.1.0"
description = "REST API"
requires-python = ">=3.11"
dependencies = [
  "vngis",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
vngis = { workspace = true }
