[project]
name = "worker"
version = "0.1.0"
description = "Scheduler và job nền"
requires-python = ">=3.11"
dependencies = [
  "vngis",
  "phasegnn",
  "apscheduler>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.uv.sources]
vngis = { workspace = true }
phasegnn = { workspace = true }
